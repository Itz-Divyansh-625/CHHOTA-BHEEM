<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHHOTA BHEEM AI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
}

header{
    background:#1f2937;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

#chat{
    height:70vh;
    overflow-y:auto;
    padding:15px;
}

.user{
    text-align:right;
    margin:10px;
}

.bot{
    text-align:left;
    margin:10px;
}

.msg{
    display:inline-block;
    padding:10px 15px;
    border-radius:12px;
    max-width:80%;
}

.user .msg{
    background:#2563eb;
}

.bot .msg{
    background:#374151;
}

.bottom{
    display:flex;
    padding:10px;
    background:#1f2937;
}

input{
    flex:1;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    background:#10b981;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>

<body>

<header>
🤖 CHHOTA BHEEM AI
</header>

<div id="chat"></div>

<div class="bottom">
<input id="message" placeholder="Type your message...">
<button onclick="sendMessage()">Send</button>
</div>

<script>

async function sendMessage(){

let input=document.getElementById("message");
let text=input.value.trim();

if(text==="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="user">
<div class="msg">${text}</div>
</div>
`;

input.value="";

const response=await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});

const data=await response.json();

chat.innerHTML+=`
<div class="bot">
<div class="msg">${data.reply}</div>
</div>
`;

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
